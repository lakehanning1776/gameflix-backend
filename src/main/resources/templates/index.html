<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course Management System</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <a th:href="@{/showNewCourseForm}"
       class="btn btn-primary mb-4">
        Add Course
    </a>

    <h1>Courses List</h1>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Course Department</th>
            <th>Course Number</th>
            <th>Course Name</th>
            <th>Number of Students</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${listCourses}">
            <td th:text="${course.courseDept}"></td>
            <td th:text="${course.courseNum}"></td>
            <td th:text="${course.courseName}"></td>
            <td th:text="${course.courseStuds}"></td>

            <td>
                <a th:href="@{/showFormForUpdate/{id}(id=${course.id})}"
                   class="btn btn-primary">
                    Update
                </a>

                <a th:href="@{/deleteCourse/{id}(id=${course.id})}"
                   class="btn btn-danger">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${totalPages > 1}" class="mb-4">

        <div>
            Total Rows:
            <span th:text="${totalItems}"></span>
        </div>

        <div>
            <span th:each="i : ${#numbers.sequence(1, totalPages)}">
                <a th:if="${currentPage != i}"
                   th:href="@{'/page/' + ${i}
                   + '?sortField=' + ${sortField}
                   + '&sortDir=' + ${sortDir}}"
                   th:text="${i}"
                   class="me-2">
                </a>

                <span th:unless="${currentPage != i}"
                      th:text="${i}"
                      class="me-2 fw-bold">
                </span>
            </span>

            <a th:if="${currentPage < totalPages}"
               th:href="@{'/page/' + ${currentPage + 1}
               + '?sortField=' + ${sortField}
               + '&sortDir=' + ${sortDir}}"
               class="me-2">
                Next
            </a>

            <a th:if="${currentPage < totalPages}"
               th:href="@{'/page/' + ${totalPages}
               + '?sortField=' + ${sortField}
               + '&sortDir=' + ${sortDir}}">
                Last
            </a>
        </div>

    </div>

    <a th:href="@{/showNewStudentForm}"
       class="btn btn-primary">
        Add Student
    </a>

    <a th:href="@{/studentList}"
       class="btn btn-primary">
        Update A Student
    </a>

</div>

</body>
</html>
